<body class="bg-background text-on-background font-body-lg min-h-screen pb-40">

</button>
</header>
<main class="px-container-margin py-6 flex flex-col gap-section-gap">

<section class="flex flex-col gap-2">
<p class="font-label-md text-label-md text-outline uppercase tracking-wider">今日训练 • 2023年10月24日</p>
<h2 class="font-display text-display text-on-background">下肢力量强化</h2>
</section>
<!-- Exercise Card 1 -->
<article class="bg-surface-container-lowest rounded-[24px] p-card-padding shadow-[0_10px_30px_-15px_rgba(0,107,95,0.04)] flex flex-col gap-5 border border-surface-container-low/50">
<div class="flex justify-between items-start">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-primary-container/30 flex items-center justify-center text-primary">

</div>
<div>

</div>
</div>
<button class="text-outline-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>

<span class="flex-1 text-center">重量 (kg)</span>
<span class="flex-1 text-center">次数</span>
<span class="w-10 text-center">完成</span>
</div>

<div class="flex-1">
<input class="w-full bg-surface-container-highest text-center font-body-lg text-body-lg text-on-surface border-none rounded-lg focus:ring-2 focus:ring-primary h-11" placeholder="-" type="number" value="10"/>
</div>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:scale-110 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
<!-- In-progress Set -->
<div class="flex items-center gap-2 bg-surface-bright rounded-lg p-2 transition-colors relative shadow-sm ring-1 ring-primary-container/50">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-l-lg"></div>
<span class="w-8 text-center font-body-md text-body-md text-on-surface-variant font-medium">2</span>

<div class="flex-1">

<span class="material-symbols-outlined">radio_button_unchecked</span>
</button>
</div>
<!-- Empty Set -->

<input class="w-full bg-surface-container-highest/50 text-center font-body-lg text-body-lg text-on-surface border-none rounded-lg focus:ring-2 focus:ring-primary h-11" placeholder="100" type="number"/>

<div>

</div>
<button class="text-outline-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">more_horiz</span>

<div class="flex items-center px-2 text-outline font-label-md text-label-md">
<span class="w-8 text-center">组数</span>
<span class="flex-1 text-center">重量 (kg)</span>
<span class="flex-1 text-center">次数</span>

<div class="flex items-center gap-2 bg-surface-bright rounded-lg p-2">

<div class="flex-1">
<input class="w-full bg-surface-container-highest text-center font-body-lg text-body-lg text-on-surface border-none rounded-lg focus:ring-2 focus:ring-primary h-11" placeholder="10" type="number"/>

<span class="material-symbols-outlined">radio_button_unchecked</span>
</button>

</div>
<button class="flex items-center justify-center gap-2 py-3 mt-2 rounded-xl bg-surface hover:bg-surface-container transition-colors text-secondary font-body-md text-body-md font-medium w-full">

</div>

<div>
<div class="flex justify-between items-center mb-2">
<label class="font-label-md text-label-md text-on-surface-variant">疲劳程度评分</label>
<span class="font-headline-md text-[16px] text-primary">7/10</span>
</div>
<input class="w-full h-2 bg-surface-variant rounded-lg appearance-none cursor-pointer" max="10" min="1" type="range" value="7"/>
<div class="flex justify-between px-1 mt-1 font-label-md text-[10px] text-outline">
<span>轻松</span>
<span>极度疲劳</span>

</div>
<input class="w-full h-2 bg-surface-variant rounded-lg appearance-none cursor-pointer" max="10" min="1" style="accent-color: #006591;" type="range" value="8"/>

<label class="block font-label-md text-label-md text-on-surface-variant mb-3">今日状态</label>

<button class="py-3 rounded-xl bg-primary-container text-on-primary-container font-body-md text-body-md font-medium shadow-sm ring-1 ring-primary/20">好</button>

</div>

<label class="block font-label-md text-label-md text-on-surface-variant mb-2">备注</label>
<textarea class="w-full bg-surface-container-highest text-on-surface font-body-lg text-body-lg border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none resize-none" placeholder="记录一下今天的感受、饮食或需要改进的地方..." rows="3"></textarea>
</div>
</div>
</section>

<span class="font-label-md text-label-md mt-1">Plan</span>
</div>
<div class="flex flex-col items-center justify-center text-primary relative after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-secondary after:rounded-full cursor-pointer group">
<span class="material-symbols-outlined group-active:scale-90 transition-transform duration-200" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-label-md text-label-md mt-1">History</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-secondary transition-colors cursor-pointer group">
<span class="material-symbols-outlined group-active:scale-90 transition-transform duration-200">photo_library</span>
<span class="font-label-md text-label-md mt-1">Photos</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-secondary transition-colors cursor-pointer group">
