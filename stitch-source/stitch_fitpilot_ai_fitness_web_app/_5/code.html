<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>实时训练记录 - FitPilot AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#161d1b",
                        "surface-container-highest": "#dde4e1",
                        "secondary": "#006591",
                        "outline": "#6b7a76",
                        "primary-container": "#2dd4bf",
                        "tertiary-container": "#ffad3a",
                        "secondary-container": "#39b8fd",
                        "secondary-fixed-dim": "#89ceff",
                        "inverse-primary": "#3cddc7",
                        "outline-variant": "#bacac5",
                        "primary-fixed": "#62fae3",
                        "on-primary-container": "#00574d",
                        "surface-variant": "#dde4e1",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-primary-fixed": "#00201c",
                        "primary-fixed-dim": "#3cddc7",
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-surface": "#2b3230",
                        "on-tertiary-container": "#6d4400",
                        "surface-bright": "#f4fbf8",
                        "tertiary-fixed": "#ffddb8",
                        "surface-dim": "#d4dcd9",
                        "tertiary": "#855300",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#001e2f",
                        "on-secondary-container": "#004666",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e2eae7",
                        "primary": "#006b5f",
                        "surface-tint": "#006b5f",
                        "surface-container": "#e8efec",
                        "on-primary-fixed-variant": "#005047",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#3c4a46",
                        "on-surface": "#161d1b",
                        "inverse-on-surface": "#ebf2ef",
                        "on-secondary-fixed-variant": "#004c6e",
                        "background": "#f4fbf8",
                        "surface": "#f4fbf8",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eef5f2",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#c9e6ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "16px",
                        "section-gap": "32px",
                        "container-margin": "20px",
                        "card-padding": "24px"
                    },
                    "fontFamily": {
                        "display": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-48">
<!-- Top Navigation (Transactional/Task-focused, so standard nav is suppressed per shell mandate, but we need a custom active header) -->
<header class="bg-surface/70 backdrop-blur-xl shadow-[0_10px_30px_-15px_rgba(0,107,95,0.04)] sticky top-0 z-50 flex justify-between items-center w-full px-container-margin py-4">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
<div>
<h1 class="font-display text-headline-md font-bold text-primary">今日训练：胸部</h1>
<div class="flex items-center gap-1 text-secondary font-label-md text-label-md mt-1">
<span class="material-symbols-outlined" style="font-size: 14px;">timer</span>
<span>45:20</span>
</div>
</div>
</div>
<button class="text-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 rounded-full bg-primary-container/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</header>
<main class="px-container-margin py-section-gap flex flex-col gap-section-gap max-w-3xl mx-auto">
<!-- Exercise Card 1 -->
<article class="bg-surface-container-lowest rounded-xl shadow-[0_10px_30px_-15px_rgba(0,107,95,0.04)] overflow-hidden">
<div class="p-card-padding flex flex-col gap-stack-gap">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-1">杠铃卧推</h2>
<p class="font-body-md text-body-md text-on-surface-variant">目标：4 组 x 8-12 次</p>
</div>
<button class="text-outline hover:text-primary transition-colors p-2 -mr-2 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<!-- Sets Table Header -->
<div class="grid grid-cols-12 gap-2 font-label-md text-label-md text-outline-variant px-2 pb-2 border-b border-surface-container">
<div class="col-span-2 text-center">组数</div>
<div class="col-span-4 text-center">重量 (KG)</div>
<div class="col-span-4 text-center">次数</div>
<div class="col-span-2 text-center"><span class="material-symbols-outlined" style="font-size: 16px;">check</span></div>
</div>
<!-- Set Rows -->
<div class="flex flex-col gap-3">
<!-- Completed Set -->
<div class="grid grid-cols-12 gap-2 items-center bg-surface-bright p-2 rounded-lg">
<div class="col-span-2 text-center font-body-md text-body-md text-outline font-semibold">1</div>
<div class="col-span-4 relative">
<input class="w-full bg-surface-container-low border-none rounded-lg text-center font-body-lg text-body-lg text-on-surface py-3 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" placeholder="-" type="number" value="80"/>
</div>
<div class="col-span-4 relative">
<input class="w-full bg-surface-container-low border-none rounded-lg text-center font-body-lg text-body-lg text-on-surface py-3 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" placeholder="-" type="number" value="12"/>
</div>
<div class="col-span-2 flex justify-center">
<button class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 20px; font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
</div>
<!-- Active Set -->
<div class="grid grid-cols-12 gap-2 items-center bg-primary-container/10 p-2 rounded-lg border border-primary-container/30">
<div class="col-span-2 text-center font-body-md text-body-md text-primary font-bold">2</div>
<div class="col-span-4 relative">
<input class="w-full bg-surface-container-lowest border-none rounded-lg text-center font-body-lg text-body-lg text-on-surface py-3 focus:ring-2 focus:ring-primary shadow-sm transition-colors" placeholder="-" type="number" value="85"/>
</div>
<div class="col-span-4 relative">
<input class="w-full bg-surface-container-lowest border-none rounded-lg text-center font-body-lg text-body-lg text-on-surface py-3 focus:ring-2 focus:ring-primary shadow-sm transition-colors" placeholder="-" type="number" value=""/>
</div>
<div class="col-span-2 flex justify-center">
<button class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-outline hover:bg-primary-container hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">check</span>
</button>
</div>
</div>
<!-- Pending Set -->
<div class="grid grid-cols-12 gap-2 items-center p-2 rounded-lg">
<div class="col-span-2 text-center font-body-md text-body-md text-outline">3</div>
<div class="col-span-4 relative">
<input class="w-full bg-surface-container-low/50 border-none rounded-lg text-center font-body-lg text-body-lg text-outline-variant py-3 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" placeholder="85" type="number" value=""/>
</div>
<div class="col-span-4 relative">
<input class="w-full bg-surface-container-low/50 border-none rounded-lg text-center font-body-lg text-body-lg text-outline-variant py-3 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" placeholder="8" type="number" value=""/>
</div>
<div class="col-span-2 flex justify-center">
<button class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-outline-variant opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined" style="font-size: 20px;">check</span>
</button>
</div>
</div>
</div>
<button class="mt-2 w-full py-3 flex items-center justify-center gap-2 text-primary font-label-md text-label-md rounded-lg hover:bg-primary-container/10 transition-colors"><span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                    添加一组</button>
</div>
</article>
<!-- AI Insight Chip -->
<div class="flex justify-center">
<div class="bg-secondary-container/20 px-4 py-2 rounded-full flex items-center gap-2 shadow-[0_4px_12px_rgba(0,101,145,0.05)] border border-secondary-container/30">
<span class="material-symbols-outlined text-secondary" style="font-size: 16px;">smart_toy</span>
<span class="font-body-md text-body-md text-secondary">状态不错。下一组建议尝试 85kg 做 8 次。</span>
</div>
</div>
</main>
<!-- Bottom Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-t border-surface-container">
<div class="max-w-3xl mx-auto px-container-margin py-4">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-full shadow-[0_10px_20px_-10px_rgba(0,107,95,0.3)] hover:opacity-90 transition-opacity flex items-center justify-center gap-2 mb-4">
<span class="material-symbols-outlined">auto_awesome</span>
            完成训练并获取 AI 分析
        </button>
<nav class="flex justify-between items-center py-2">
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined">calendar_today</span>
<span class="text-[10px] font-semibold">今日</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">event_note</span>
<span class="text-[10px] font-semibold">计划</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] font-semibold">记录</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">photo_library</span>
<span class="text-[10px] font-semibold">相册</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-semibold">我的</span>
</button>
</nav>
</div>
</div>
</body></html>
