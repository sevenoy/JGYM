<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-margin py-4 sticky top-0 z-50 bg-surface/70 dark:bg-surface-container/70 backdrop-blur-xl shadow-[0_10px_30px_-15px_rgba(0,107,95,0.04)]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant/30">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<h1 class="font-display text-headline-md font-bold text-primary dark:text-primary-fixed-dim">FitPilot AI</h1>
</div>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-margin py-section-gap pb-[120px] max-w-3xl mx-auto w-full">
<!-- Page Header -->
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">AI 提示词设置</h2>
<p class="font-body-md text-body-md text-on-surface-variant">配置您的智能服务商，并根据您的整体健康目标量身定制辅导体验。</p>
</div>
<!-- Settings Form Card (Glassmorphic & Soft Shadow) -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-[0_10px_30px_-15px_rgba(0,107,95,0.04)] p-card-padding flex flex-col gap-6 relative overflow-hidden">
<!-- Subtle Decorative Gradient -->
<div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-bl from-primary-container/20 to-transparent rounded-full blur-3xl -z-10 pointer-events-none"></div>
<!-- Provider Selection -->
<div>
<label class="font-label-md text-label-md text-on-surface-variant mb-3 block uppercase tracking-wider">服务商</label>
<div class="relative group">
<select class="w-full bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-xl px-5 py-4 appearance-none outline-none border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest transition-all cursor-pointer">
<option value="openai">OpenAI (推荐)</option>
<option value="anthropic">Anthropic Claude</option>
<option value="google">Google Gemini</option>
<option value="custom">自定义服务商</option>
</select>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant group-hover:text-primary transition-colors pointer-events-none">expand_more</span>
</div>
</div>
<!-- API Key Input -->
<div>
<label class="font-label-md text-label-md text-on-surface-variant mb-3 block uppercase tracking-wider">API 密钥</label>
<div class="relative group">
<input class="w-full bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-xl px-5 py-4 outline-none border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest transition-all pr-14 placeholder:text-outline-variant" placeholder="sk-..." type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1 rounded-full hover:bg-surface-container" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="font-body-md text-[13px] text-outline mt-2">您的密钥已安全地本地存储在您的设备上。</p>
</div>
<!-- Model Selection -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<div>
<label class="font-label-md text-label-md text-on-surface-variant mb-3 block uppercase tracking-wider">模型</label>
<div class="relative group">
<select class="w-full bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-xl px-5 py-4 appearance-none outline-none border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest transition-all cursor-pointer">
<option value="gpt-4o">gpt-4o (最适合视觉)</option>
<option value="gpt-4-turbo">gpt-4-turbo</option>
<option value="gpt-3.5-turbo">gpt-3.5-turbo (快速)</option>
</select>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Base URL -->
<div>
<label class="font-label-md text-label-md text-on-surface-variant mb-3 block uppercase tracking-wider flex items-center justify-between">
                        基础 URL
                        <span class="normal-case text-outline font-normal">可选</span>
</label>
<input class="w-full bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-xl px-5 py-4 outline-none border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant" placeholder="https://api.openai.com/v1" type="url"/>
</div>
</div>
<!-- Enable Image Analysis (Bento-style row) -->
<div class="flex items-center justify-between p-5 bg-surface-container-low rounded-xl border border-surface-container-high mt-2">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center text-secondary shrink-0 mt-0.5">
<span class="material-symbols-outlined">no_photography</span>
</div>
<div>
<div class="font-headline-md text-[16px] text-on-surface mb-1">启用图像分析</div>
<div class="font-body-md text-body-md text-on-surface-variant text-[13px] max-w-[280px]">允许 FitPilot AI 通过您上传的照片分析锻炼姿势和营养。</div>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer ml-4">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary shadow-sm"></div>
</label>
</div>
<!-- Prompt Template -->
<div class="mt-2">
<label class="font-label-md text-label-md text-on-surface-variant mb-3 block uppercase tracking-wider flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">edit_document</span>
                    系统提示词模板
                </label>
<textarea class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl px-5 py-4 outline-none border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest transition-all resize-none leading-relaxed" placeholder="在此处定义 AI 的角色设定..." rows="4">你是 FitPilot，一位精英健康教练。专注于鼓励可持续的健康习惯，而不是激进的内卷文化。根据用户的日常活动和姿势检查照片提供简明、可操作的见解。</textarea>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 mt-6 pt-6 border-t border-surface-container-high">
<button class="flex-1 bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md rounded-full px-6 py-4 flex items-center justify-center gap-2 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">cell_tower</span>
                    测试连接
                </button>
<button class="flex-[2] bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md rounded-full px-6 py-4 flex items-center justify-center gap-2 shadow-[0_4px_14px_0_rgba(0,107,95,0.25)] transition-all transform hover:-translate-y-0.5 active:translate-y-0" type="button">
<span class="material-symbols-outlined text-[18px]">cloud_done</span>
                    保存设置
                </button>
</div>
</div>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface/70 dark:bg-surface-container/70 backdrop-blur-xl border-t border-outline-variant/30 shadow-[0_-10px_30px_-15px_rgba(0,107,95,0.04)] md:hidden rounded-t-xl">
<!-- Today (Inactive) -->
<button class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:text-secondary transition-colors group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">calendar_today</span>
<span class="font-label-md text-label-md">今日</span>

<button class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:text-secondary transition-colors group">

</button>

<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">history</span>
<span class="font-label-md text-label-md">记录</span>
</button>
<!-- Photos (Inactive) -->
<button class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:text-secondary transition-colors group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">photo_library</span>
<span class="font-label-md text-label-md">相册</span>
</button>
<!-- Profile (Active) - Settings is a sub-domain of Profile -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim relative after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-secondary after:rounded-full hover:text-secondary transition-colors scale-90 transition-transform duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md font-bold">我的</span>
</button>
